; ==============================================================================
; PHP-FPM Pool Configuration for WordPress
; ==============================================================================
; Key change: listen on TCP port 9000 instead of the default Unix socket
; so NGINX (in a separate container) can reach php-fpm over the Docker network.
; ==============================================================================

[www]
; Run as www-data user/group
user = www-data
group = www-data

; Listen on TCP port 9000 on ALL interfaces (so NGINX container can connect)
; Default is a Unix socket (/run/php/php7.4-fpm.sock), which only works
; within the same container — useless for us since NGINX is in a separate container.
listen = 0.0.0.0:9000

; Process manager: dynamic = spawn workers on demand
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Clear environment variables passed via Docker (security: don't leak to PHP scripts)
clear_env = no
