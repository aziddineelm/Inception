[www]
; Run processes under www-data user and group
user = www-data
group = www-data

; Listen on TCP port 9000 on all interfaces so NGINX can connect over Docker network
; (Default was a unix socket /run/php/php7.4-fpm.sock which only works within the same container)
listen = 0.0.0.0:9000

; Dynamic process management to handle incoming requests
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Allow PHP scripts to read environment variables passed into the container
clear_env = no
