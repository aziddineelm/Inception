events {}

http {
    # Include MIME types so CSS/JS/images are served correctly
    include /etc/nginx/mime.types;

    server {
        # Listen on port 443 with SSL only
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name ael-mans.42.fr;

        # Only allow TLSv1.2 and TLSv1.3
        ssl_protocols TLSv1.2 TLSv1.3;

        # SSL certificate paths (generated by setup.sh)
        ssl_certificate     /etc/ssl/certs/nginx.crt;
        ssl_certificate_key /etc/ssl/private/nginx.key;

        # Root directory where WordPress files are stored (shared volume)
        root /var/www/html;
        index index.php index.html;

        # Try to serve the file directly, otherwise pass to index.php
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Pass PHP files to WordPress container (php-fpm on port 9000)
        location ~ \.php$ {
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
