# Run in standalone mode listening for incoming connections
listen=YES
listen_ipv6=NO

# Disable anonymous access (require login)
anonymous_enable=NO

# Allow local Linux users to log in
local_enable=YES

# Allow file write / upload permissions
write_enable=YES
local_umask=022

# Restrict (jail) users to their home directory
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Passive mode settings for container networking
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21100
pasv_address=127.0.0.1

# Root directory pointing to the shared WordPress files volume
local_root=/var/www/html
