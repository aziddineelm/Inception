events {}

http {
    # Include standard MIME types for CSS/JS
    include /etc/nginx/mime.types;

    server {
        # Port for static website
        listen 8080;
        server_name _;

        # Root directory for HTML/CSS files
        root /var/www/static;
        index index.html;

        # Serve static files directly
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
