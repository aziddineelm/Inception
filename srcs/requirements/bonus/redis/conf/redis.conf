# Listen on all interfaces so WordPress container can connect over Docker network
bind 0.0.0.0
port 6379

# Disable protected mode for container networking
protected-mode no

# Set memory limit and LRU eviction policy for caching
maxmemory 256mb
maxmemory-policy allkeys-lru

# Run in foreground (daemonize no is required for Docker)
daemonize no
