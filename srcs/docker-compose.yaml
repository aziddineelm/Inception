# ==============================================================================
#  Inception - Docker Compose
# ==============================================================================
#  Architecture:
#    Internet → [NGINX :443 TLS] → [WordPress php-fpm :9000] → [MariaDB :3306]
#
#  Volumes:
#    wp_data   → WordPress files  → /home/ael-mans/data/wordpress
#    db_data   → MariaDB data     → /home/ael-mans/data/mariadb
#
#  Network:
#    inception → custom bridge network connecting all services
# ==============================================================================

services:

  # ──────────────────────────────────────────────────────────────────────────────
  # NGINX — The ONLY entrypoint (port 443, TLSv1.2/TLSv1.3)
  # ──────────────────────────────────────────────────────────────────────────────
  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    restart: on-failure
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}

  # ──────────────────────────────────────────────────────────────────────────────
  # WordPress + PHP-FPM (no NGINX here!)
  # ──────────────────────────────────────────────────────────────────────────────
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    restart: on-failure
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_PASSWORD: ${WP_USER_PASSWORD}
      WP_USER_EMAIL: ${WP_USER_EMAIL}

  # ──────────────────────────────────────────────────────────────────────────────
  # MariaDB — Database server
  # ──────────────────────────────────────────────────────────────────────────────
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

# ==============================================================================
# Volumes — Named volumes (NO bind mounts!)
# Both store data at /home/ael-mans/data/ on the host machine
# ==============================================================================
volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ael-mans/data/wordpress

  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ael-mans/data/mariadb

# ==============================================================================
# Networks — Custom bridge network (NO host network, NO links!)
# ==============================================================================
networks:
  inception:
    driver: bridge
